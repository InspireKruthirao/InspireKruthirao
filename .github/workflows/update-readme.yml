name: Update README

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:       # run it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate terminal card
        run: python3 scripts/make_terminal.py

      - name: Regenerate stats card
        run: python3 scripts/make_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}

      - name: Refresh repo list and recent activity
        run: python3 scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "Nithya Kruthi Macha"
          git config user.email "82725469+InspireKruthirao@users.noreply.github.com"
          git add README.md assets/terminal.svg assets/stats.svg
          git commit -m "Update README"
          git push
